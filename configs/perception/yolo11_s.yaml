# YOLO11s Configuration for MoodPlay (COCO-safe labels)
model_path: "models/checkpoints/yolo/yolo11s.pt"
device: "cuda"
conf_threshold: 0.20
iou_threshold: 0.6
target_labels:
  - "person"
  - "tie"
  - "handbag"
  - "backpack"
  - "umbrella"
  - "suitcase"
  - "car"
  - "truck"
  - "bus"
  - "motorcycle"
  - "bicycle"
  - "train"
  - "boat"
  - "traffic light"
  - "stop sign"
  - "bench"
  - "chair"
  - "couch"
  - "potted plant"
label_aliases: {}
mask_refine:
  box_pad_ratio: 0.10
  min_area: 32
  morph_kernel: 1
id_match_iou: 0.3
scene_fallback:
  enabled: true
  mode: "no_detections"
  track: false
  label: "scene"

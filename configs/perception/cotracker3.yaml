# CoTracker3 Tracking Configuration
checkpoint: "models/checkpoints/cotracker/cotracker3.pth"
device: "cuda"
points_per_instance: 32
keyframe_stride: 4
max_frames_per_chunk: 24
max_total_frames: null

keyframe:
  enable_scene_cuts: true
  scene_cut_threshold: 0.42
  scene_cut_min_gap: 3

association:
  weight_iou: 0.70
  weight_app: 0.10
  weight_motion: 0.20
  min_iou_gate: 0.05
  min_app_gate: 0.10
  max_cost: 0.92
  max_missed_keyframes: 10
  embedding_dim: 64

recovery:
  enable_selective_redetect: true
  missing_ratio_trigger: 0.40
  overlap_trigger: 0.35
  min_redetect_gap: 8


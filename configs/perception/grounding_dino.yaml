# GroundingDINO Configuration (SwinB)
# Runs via scripts/gdino_worker.py in a separate conda env.
enabled: true
env_name: "gdino310"
conda_exe: "C:\\Users\\LENOVO\\miniconda3\\condabin\\conda.bat"
script_path: "scripts/gdino_worker.py"
model_config: "configs/perception/grounding_dino/GroundingDINO_SwinB.cfg.py"
model_weights: "models/checkpoints/grounding_dino/groundingdino_swinb_cogcoor.pth"
device: "cuda"
box_threshold: 0.30
text_threshold: 0.24
max_detections: 80
max_prompts: 10
box_pad_ratio: 0.10
mask_selection: "score"
area_weight: 0.10
score_threshold: 0.0
score_thresholds:
  road: 0.12
  street: 0.14
  building: 0.16
  house: 0.14
  sky: 0.10
default_preset: "urban_street"
default_clutter: "medium"

runtime:
  preset: "urban_street"
  clutter_level: "medium"

environment_presets:
  urban_street:
    box_threshold:
      low: 0.24
      medium: 0.30
      high: 0.34
    text_threshold:
      low: 0.20
      medium: 0.24
      high: 0.28
    prompts:
      - "road surface"
      - "lane markings"
      - "building facade"
      - "urban building"
      - "street tree"
      - "tree canopy"
      - "sidewalk curb"
      - "parked vehicle"
      - "traffic light pole"
      - "street sign"
      - "pedestrian crossing"
      - "skyline horizon"
  indoor_room:
    box_threshold:
      low: 0.25
      medium: 0.30
      high: 0.34
    text_threshold:
      low: 0.18
      medium: 0.22
      high: 0.26
    prompts:
      - "sofa couch"
      - "dining chair"
      - "table surface"
      - "window frame"
      - "floor area"
      - "wall corner"
      - "indoor plant"
  nature_trail:
    box_threshold:
      low: 0.24
      medium: 0.29
      high: 0.33
    text_threshold:
      low: 0.18
      medium: 0.22
      high: 0.26
    prompts:
      - "tree trunk"
      - "foliage canopy"
      - "trail path"
      - "rock surface"
      - "water stream"
      - "mountain ridge"

prompts:
  - "road surface"
  - "building facade"
  - "street tree"
  - "tree canopy"
  - "sidewalk curb"
  - "parked vehicle"
  - "skyline horizon"

# DLL dirs required on Windows before importing groundingdino._C
# Update these if your paths differ.
torch_lib_dir: "C:\\Users\\LENOVO\\miniconda3\\envs\\gdino310\\Lib\\site-packages\\torch\\lib"
cuda_bin_dir: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.4\\bin"

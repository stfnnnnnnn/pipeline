# GroundingDINO Configuration (SwinB)
# Runs via scripts/gdino_worker.py in a separate conda env.
enabled: true
env_name: "gdino310"
conda_exe: "C:\\Users\\LENOVO\\miniconda3\\condabin\\conda.bat"
script_path: "scripts/gdino_worker.py"
model_config: "configs/perception/grounding_dino/GroundingDINO_SwinB.cfg.py"
model_weights: "models/checkpoints/grounding_dino/groundingdino_swinb_cogcoor.pth"
device: "cuda"
box_threshold: 0.16
text_threshold: 0.15
max_detections: 180
max_prompts: 15
box_pad_ratio: 0.10
mask_selection: "score"
area_weight: 0.10
score_threshold: 0.0
score_thresholds:
  road: 0.12
  street: 0.14
  building: 0.16
  house: 0.14
  sky: 0.10
default_preset: "urban_street"
default_clutter: "medium"

runtime:
  preset: "urban_street"
  clutter_level: "medium"

environment_presets:
  urban_street:
    box_threshold:
      low: 0.12
      medium: 0.16
      high: 0.20
    text_threshold:
      low: 0.10
      medium: 0.15
      high: 0.18
    prompts:
      - "person"
      - "handbag"
      - "car"
      - "bus"
      - "building facade"
      - "road surface"
      - "sidewalk"
      - "tree"
      - "traffic light"
      - "skyline horizon"
  indoor_room:
    box_threshold:
      low: 0.25
      medium: 0.30
      high: 0.34
    text_threshold:
      low: 0.18
      medium: 0.22
      high: 0.26
    prompts:
      - "sofa couch"
      - "dining chair"
      - "table surface"
      - "window frame"
      - "floor area"
      - "wall corner"
      - "indoor plant"
  nature_trail:
    box_threshold:
      low: 0.24
      medium: 0.29
      high: 0.33
    text_threshold:
      low: 0.18
      medium: 0.22
      high: 0.26
    prompts:
      - "tree trunk"
      - "foliage canopy"
      - "trail path"
      - "rock surface"
      - "water stream"
      - "mountain ridge"

prompts:
  - "person"
  - "handbag"
  - "car"
  - "bus"
  - "truck"
  - "building facade"
  - "road surface"
  - "sidewalk"
  - "tree"
  - "street sign"
  - "skyline horizon"

# DLL dirs required on Windows before importing groundingdino._C
# Update these if your paths differ.
torch_lib_dir: "C:\\Users\\LENOVO\\miniconda3\\envs\\gdino310\\Lib\\site-packages\\torch\\lib"
cuda_bin_dir: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.4\\bin"

mask_guard:
  default_max_mask_to_box_ratio: 3.2
  global_max_area_ratio: 0.82
  oversize_penalty: 2.8
  large_stuff_labels:
    - "skyline horizon"
    - "building facade"
    - "road surface"
    - "sidewalk"
    - "tree"

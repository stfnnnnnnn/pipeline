# GroundingDINO Configuration (SwinB)
# Runs via scripts/gdino_worker.py in a separate conda env.
enabled: true
env_name: "gdino310"
# Optional: set to null to auto-detect conda across machines.
conda_exe: null
script_path: "scripts/gdino_worker.py"
model_config: "configs/perception/grounding_dino/GroundingDINO_SwinB.cfg.py"
model_weights: "models/checkpoints/grounding_dino/groundingdino_swinb_cogcoor.pth"
device: "cuda"
# Keep GPU-first behavior; set true only if CPU fallback is acceptable.
allow_cpu_fallback: false
box_threshold: 0.32
text_threshold: 0.23
max_detections: 30
box_pad_ratio: 0.15
mask_selection: "area"
area_weight: 0.4
prompts:
  - "building"
  - "buildings"
  - "house"
  - "tree"
  - "forest"
  - "road"
  - "roads"
  - "street"
  - "sidewalk"
  - "sky"
  - "wall"
  - "grass"
  - "mountain"
  - "water"
# Optional DLL dirs on Windows before importing groundingdino._C.
# Keep null to auto-detect from env/CUDA installation.
torch_lib_dir: null
cuda_bin_dir: null

# sam2_hiera_s.yaml
model:
  _target_: sam2.modeling.sam2_base.SAM2Base
  image_encoder:
    _target_: sam2.modeling.backbones.image_encoder.ImageEncoder
    scalp: 1
    embed_dim: 96
    num_heads: 12
    drop_path_rate: 0.1
    use_abs_pos: True
    window_spec: [7, 7, 7, 7]
    window_size: 7
    stages: [2, 3, 16, 3]
    global_att_blocks: [18, 21]
    return_interm_indices: [0, 1, 2, 3]
  memory_attention:
    _target_: sam2.modeling.memory_attention.MemoryAttention
    d_model: 256
    nhead: 8
    num_layers: 4
  memory_encoder:
    _target_: sam2.modeling.memory_encoder.MemoryEncoder
    out_dim: 64